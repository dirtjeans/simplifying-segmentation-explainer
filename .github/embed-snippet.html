<!-- Simplifying Segmentation explainer. Paste all of this into one Webflow Code Embed element. -->
<div class="ss-explainer" style="background:#1A2C32">
  <iframe title="Simplifying Segmentation: seven simple steps (interactive explainer)"
          src="/interactive-tools/simplifying-segmentation-explainer?embed=1"
          allow="fullscreen; autoplay" allowfullscreen
          style="display:block;width:100%;aspect-ratio:16/9;min-height:320px;border:0;background:#1A2C32"></iframe>
</div>
<script>
(function () {
  var wrap = document.currentScript.previousElementSibling;
  var frame = wrap && wrap.querySelector('iframe');
  if (!frame) return;
  var info = null;

  // Height of a fixed or sticky navigation bar at the top of the page, if there is one.
  // To set it by hand, add data-top-offset="80" (pixels) to the iframe.
  function topOffset() {
    var set = frame.getAttribute('data-top-offset');
    if (set) return parseFloat(set) || 0;
    var el = document.elementFromPoint(Math.round(window.innerWidth / 2), 2), n = 0;
    while (el && el !== document.documentElement && n++ < 40) {
      var pos = getComputedStyle(el).position;
      if (pos === 'fixed' || pos === 'sticky') {
        var b = el.getBoundingClientRect().bottom;
        return b > 0 && b < window.innerHeight * 0.4 ? Math.round(b) : 0;
      }
      el = el.parentElement;
    }
    return 0;
  }

  function size() {
    if (!info) return;
    var h;
    if (info.layout === 'stacked') {
      // Phones and narrow frames: the frame is as tall as its content, so only the page scrolls.
      if (!info.height) return;
      h = info.height;
    } else {
      // Wide frames: 16:9 plus the control bar, and never taller than the window.
      h = Math.max(320, Math.min(Math.round(frame.clientWidth * 9 / 16) + info.bar, window.innerHeight - topOffset()));
    }
    frame.style.aspectRatio = 'auto';
    frame.style.height = h + 'px';
  }

  function hello() {
    if (frame.contentWindow) frame.contentWindow.postMessage({ source: 'illumio-explainer-host', type: 'ack' }, '*');
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.source !== frame.contentWindow || !d || d.source !== 'illumio-explainer' || d.type !== 'size') return;
    info = d;
    if (!d.hosted) hello();
    size();
  });
  window.addEventListener('resize', size);
  frame.addEventListener('load', hello);
})();
</script>
