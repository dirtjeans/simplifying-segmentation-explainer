<script>
/* Stopgap shell: the site's header and footer around the explainer.

   The explainer itself is app.html. This page is what a visitor gets at the tool's public address. It
   fetches the Webflow page that holds the site navigation, a frame for the explainer, and the site
   footer, and shows that page here, so the visitor sees the real site components at this address.

   Remove this file (and rename app.html back to index.html) once a regular Webflow page can answer at
   this address. See .github/README.md, "Site header and footer". */
(function () {
  var SITE_PAGE = '/simplifying-segmentation-explainer';   /* the Webflow page: header, frame, footer */
  var MOUNT = location.pathname.replace(/\/(index\.html)?$/, '');
  var HERE = 'https://www.illumio.com' + MOUNT;
  function bare() { location.replace(MOUNT + '/app.html' + location.search + location.hash); }

  /* Shown in a frame, or asked for the tool alone (?embed=1 or ?bare=1): hand over to the explainer. */
  if (window.top !== window.self || /[?&](embed|bare)=1(&|$)/.test(location.search)) return bare();

  fetch(SITE_PAGE, { cache: 'no-cache', credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('site page ' + r.status); return r.text(); })
    .then(function (html) {
      /* Only use it if it is still the page that frames this tool. */
      if (html.indexOf('<iframe') < 0 || html.indexOf(MOUNT) < 0) throw new Error('site page does not frame this tool');
      /* The page describes itself by its own address. Make it describe this one. */
      html = html
        .replace(/<link\b[^>]*\brel=["']canonical["'][^>]*>/i, '<link rel="canonical" href="' + HERE + '">')
        .replace(/<meta\b[^>]*\bproperty=["']og:url["'][^>]*>/i, '<meta property="og:url" content="' + HERE + '">')
        .replace(/<link\b[^>]*\bhreflang=[^>]*>/gi, '');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(bare);   /* any trouble: show the explainer on its own */
})();
</script>
