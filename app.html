<style>
:root{
  /* Illumio Design System tokens */
  --orange-100:#ff5500; --orange-110:#f97607;
  --cyan-120:#1a2c32; --cyan-110:#24393f; --cyan-100:#2d454c; --cyan-90:#325158; --cyan-80:#356069;
  --slate-20:#d6d7d7; --slate-30:#c1c3c3; --slate-50:#989a9b; --white:#ffffff;
  --font-brand:'FK Grotesk',sans-serif;
  --font-mono:var(--font-brand); /* small labels and figures: FK Grotesk with tabular numerals */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --radius-sm:4px;
  /* layout: one 16:9 stage. Copy in the left third, isometric map on the right, chapter rail below. */
}
@font-face{font-family:"FK Grotesk";src:url("https://cdn.prod.website-files.com/63cdb40b25368837c04197b3/6707c08c58e8fda5d4ff68dd_FKGrotesk-Light.woff") format("woff");font-weight:300;font-style:normal;font-display:block}
@font-face{font-family:"FK Grotesk";src:url("https://cdn.prod.website-files.com/63cdb40b25368837c04197b3/6707c08ccf04d235d6f3fe38_FKGrotesk-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"FK Grotesk";src:url("https://cdn.prod.website-files.com/63cdb40b25368837c04197b3/6707c08c2e531c0b456b1304_FKGrotesk-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:"FK Grotesk";src:url("https://cdn.prod.website-files.com/63cdb40b25368837c04197b3/6707c08d3ce6f76b01ec3b00_FKGrotesk-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:block}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--cyan-120);color:var(--white);color-scheme:dark;
  font-family:var(--font-brand);font-weight:400;
  font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0,'dlig' 0,'hlig' 0;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
*,*::before,*::after{font-variant-ligatures:none !important;font-feature-settings:'liga' 0,'clig' 0,'dlig' 0,'hlig' 0 !important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(255,85,0,.7);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;background:var(--cyan-120)}
.wrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.stage{
  position:relative;overflow:hidden;
  width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;container-type:inline-size;
  background:
    radial-gradient(30% 36% at 87% 12%,rgba(255,85,0,.17),rgba(255,85,0,0) 70%),
    radial-gradient(70% 82% at 66% 48%,var(--cyan-100) 0%,var(--cyan-110) 46%,var(--cyan-120) 100%);
  --pad:4cqw;
  --fs-eyebrow:max(1.02cqw,10px); --fs-h1:4.4cqw; --fs-h2:3.1cqw;
  --fs-lead:max(1.45cqw,12px); --fs-small:max(.95cqw,10px); --gap:1.5cqw;
}
/* Fade the stage edges into the page colour, so letterboxed space beside or below the 16:9 stage has no seam. Sits under the map and copy. */
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--cyan-120) 0,rgba(26,44,50,0) 5%,rgba(26,44,50,0) 92%,var(--cyan-120) 100%),linear-gradient(180deg,rgba(26,44,50,0) 0,rgba(26,44,50,0) 90%,var(--cyan-120) 100%)}
.mapbox{position:absolute;inset:0}
#map{display:block;width:100%;height:100%}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(26,44,50,.9) 0%,rgba(26,44,50,0) 15%),
             linear-gradient(90deg,rgba(26,44,50,.96) 0%,rgba(26,44,50,.94) 31%,rgba(26,44,50,0) 46%),
             radial-gradient(120% 95% at 68% 46%,rgba(26,44,50,0) 58%,rgba(26,44,50,.6) 100%)}

.iris{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s var(--ease-out);background:radial-gradient(60% 66% at 66% 50%,rgba(14,25,29,0) 52%,rgba(14,25,29,.86) 100%)}
.stage.at-end .iris{opacity:1;transition:opacity 3s ease 2.2s}
.top{position:absolute;left:var(--pad);right:var(--pad);top:3.1cqw;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.logo svg{display:block;height:max(2cqw,20px);width:auto}
.stage.at-title .guide{visibility:hidden}
.guide{font:700 var(--fs-small)/1 var(--font-brand);letter-spacing:.025em;text-transform:uppercase;color:var(--slate-30);white-space:nowrap}
.status{font:500 var(--fs-small)/1 var(--font-brand);color:var(--white);padding:.65em 1.1em;border:1px solid var(--cyan-90);border-radius:999px;background:rgba(26,44,50,.82);opacity:0;transform:translateY(-4px);transition:opacity .28s var(--ease-out),transform .28s var(--ease-out);white-space:nowrap}
.status.on{opacity:1;transform:none}
.status b{color:var(--orange-100);font-weight:700;margin-right:.5em;text-transform:uppercase;letter-spacing:.025em}

.copy{position:absolute;left:var(--pad);top:9.5cqw;bottom:3.4cqw;width:33cqw}
.view{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:var(--gap)}
.view>*{margin:0;opacity:0;transform:translateY(.9em);transition:opacity .5s var(--ease-out),transform .6s var(--ease-out)}
.view.in>*{opacity:1;transform:none}
.view.in>*:nth-child(2){transition-delay:.07s}
.view.in>*:nth-child(3){transition-delay:.14s}
.view.in>*:nth-child(4){transition-delay:.21s}
.view.in>*:nth-child(5){transition-delay:.28s}
.view.in>*:nth-child(6){transition-delay:.35s}
.view.out>*{opacity:0;transform:translateY(-.5em);transition-duration:.22s;transition-delay:0s}
.view.out{pointer-events:none}

.eyebrow{font:700 var(--fs-eyebrow)/1.2 var(--font-brand);letter-spacing:.025em;text-transform:uppercase;color:var(--orange-100)}
.h1{font:300 var(--fs-h1)/1 var(--font-brand);letter-spacing:-.01em;text-wrap:balance}
.h2{font:300 var(--fs-h2)/1.04 var(--font-brand);letter-spacing:-.01em;text-wrap:balance}
.lead{font:400 var(--fs-lead)/1.36 var(--font-brand);color:var(--slate-20);max-width:30cqw}
.lead.big{font-size:calc(var(--fs-lead) * 1.3);line-height:1.3;color:var(--white)}
.meta{font:400 var(--fs-small)/1.3 var(--font-mono);color:var(--slate-50)}
.meta,.pips button,.pips .count,.list .mk,.ch .n{font-variant-numeric:tabular-nums}

.pips{display:flex;align-items:center;gap:.55cqw;flex-wrap:wrap;margin-top:.4cqw !important}
.pips button{width:2.3cqw;height:2.3cqw;min-width:22px;min-height:22px;border-radius:var(--radius-sm);border:1px solid var(--cyan-90);background:transparent;color:var(--slate-50);font:400 var(--fs-small)/1 var(--font-mono);cursor:pointer;transition:background .12s var(--ease-out),border-color .12s var(--ease-out)}
.pips button:hover{background:rgba(255,255,255,.08)}
.pips button.done{border-color:rgba(255,255,255,.45);color:var(--white)}
.pips button.cur{background:var(--orange-100);border-color:var(--orange-100);color:var(--white)}
.pips .count{margin-left:.7cqw;font:400 var(--fs-small)/1 var(--font-mono);color:var(--slate-50)}

.list{list-style:none;padding:0;display:grid;gap:.35cqw;width:100%}
.list button{display:flex;align-items:baseline;gap:.9em;width:100%;padding:.5em .7em .5em 0;background:none;border:0;border-top:1px solid var(--cyan-90);text-align:left;cursor:pointer;font:500 max(1.1cqw,11px)/1.25 var(--font-brand);color:var(--white);transition:color .12s var(--ease-out)}
.list button:hover{color:var(--orange-100)}
.list .mk{font:400 var(--fs-small)/1 var(--font-mono);color:var(--orange-100);min-width:2.2em}
.tips{list-style:none;padding:0;display:grid;gap:.75cqw}
.tips li{display:flex;gap:.8em;font:500 max(1.2cqw,11.5px)/1.3 var(--font-brand);color:var(--white)}
.tips li::before{content:"";flex:none;width:.55em;height:.55em;margin-top:.38em;background:var(--orange-100)}

.cta{display:flex;flex-wrap:wrap;gap:.8cqw}
a.btn{text-decoration:none}
/* ending: the ebook cover and one clear next step. It waits a beat so the finale lands first. */
.cover{display:block;flex:none;width:13.2cqw;aspect-ratio:694/903;border-radius:var(--radius-sm);overflow:hidden;background:var(--white);box-shadow:0 1.5cqw 4cqw rgba(8,16,19,.62),0 0 0 1px rgba(255,255,255,.12);margin-bottom:.5cqw !important}
.cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease-out)}
.cover:hover img,.cover:focus-visible img{transform:scale(1.035)}
.view.end.in>*{transition-delay:1.1s}
.view.end.in>*:nth-child(2){transition-delay:1.24s}
.view.end.in>*:nth-child(3){transition-delay:1.31s}
.view.end.in>*:nth-child(4){transition-delay:1.38s}
.view.end.in>*:nth-child(5){transition-delay:1.45s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;padding:0 14px;border:1px solid var(--cyan-90);border-radius:var(--radius-sm);background:transparent;color:var(--white);font:500 14px/1 var(--font-brand);cursor:pointer;transition:background .12s var(--ease-out),border-color .12s var(--ease-out)}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--orange-100);border-color:var(--orange-100)}
.btn.primary:hover{background:var(--orange-110);border-color:var(--orange-110)}
.btn.icon{padding:0;width:40px}
.btn svg{display:block}
.stage .btn{height:max(3cqw,38px);padding:0 max(1.3cqw,14px);font-size:max(1.05cqw,13px)}
.stage .btn.primary{box-shadow:0 8px 24px rgba(255,85,0,.28)}

.readout{position:absolute;right:var(--pad);bottom:3.4cqw;display:grid;gap:.5em;padding:1em 1.3em;min-width:17cqw;border:1px solid var(--cyan-90);border-left:2px solid var(--orange-100);border-radius:var(--radius-sm);background:rgba(26,44,50,.84);font-size:var(--fs-small);opacity:0;transform:translateY(6px);transition:opacity .28s var(--ease-out),transform .28s var(--ease-out);pointer-events:none}
.readout.on{opacity:1;transform:none}
.readout .k{font:700 .92em/1 var(--font-brand);letter-spacing:.025em;text-transform:uppercase;color:var(--slate-30)}
.readout .v{font:400 1.3em/1.15 var(--font-mono);color:var(--white);font-variant-numeric:tabular-nums;transition:color .3s var(--ease-out)}
.readout.big .v{font-size:3em;line-height:1}
.readout .v.tick{color:var(--orange-100);transition:none}

.bar{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:10px 16px;background:var(--cyan-120);border-top:1px solid var(--cyan-90)}
.transport,.aux{display:flex;gap:6px}
#play{min-width:98px}
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.ch{display:grid;gap:7px;width:100%;padding:4px 0 2px;background:none;border:0;border-radius:2px;text-align:left;cursor:pointer;color:var(--slate-50);font:500 12.5px/1.2 var(--font-brand);transition:color .12s var(--ease-out)}
.ch .lbl{display:flex;gap:7px;white-space:nowrap;overflow:hidden}
.ch .t{overflow:hidden;text-overflow:ellipsis}
.ch .n{font-family:var(--font-mono);font-weight:400}
.ch .trk{display:block;height:3px;background:var(--cyan-90);border-radius:2px;overflow:hidden;transition:background .12s var(--ease-out)}
.ch .trk i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:var(--orange-100)}
.ch:hover{color:var(--white)}
.ch:hover .trk{background:var(--cyan-80)}
.ch.done,.ch.cur{color:var(--white)}
.ch.cur .n{color:var(--orange-100)}

@media (max-aspect-ratio:11/10),(max-width:860px){
  .wrap{display:block;overflow-y:auto;container-type:normal}
  .stage{width:100%;aspect-ratio:auto;min-height:100%;container-type:normal;display:flex;flex-direction:column;overflow:visible;
    --pad:18px; --fs-eyebrow:12px; --fs-h1:38px; --fs-h2:28px; --fs-lead:16px; --fs-small:11.5px; --gap:14px}
  .top{position:static;order:-1;padding:14px var(--pad) 10px;flex-wrap:wrap}
  .logo svg{height:22px}
  .status{order:3;white-space:normal;border-radius:var(--radius-sm)}
  .status:not(.on){display:none}
  .mapbox{position:relative;inset:auto;width:100%;aspect-ratio:1/.8;flex:none}
  .scrim{display:none}
  .stage::before{display:none}
  .iris{background:radial-gradient(70% 70% at 50% 50%,rgba(14,25,29,0) 50%,rgba(14,25,29,.86) 100%)}
  .readout{right:12px;bottom:8px;min-width:0;padding:.7em .9em}
  .copy{position:relative;left:auto;top:auto;bottom:auto;width:auto;padding:6px var(--pad) 28px}
  .view{position:relative;inset:auto;justify-content:flex-start}
  .view.out{display:none}
  .lead{max-width:60ch}
  .pips{gap:6px}.pips button{width:30px;height:30px}.pips .count{margin-left:8px}
  .list{gap:0}.list button{font-size:15px;padding:.7em 0}
  .tips{gap:10px}.tips li{font-size:15px}
  .cta{gap:10px}
  .cover{width:138px;margin-bottom:4px !important}
  .stage .btn{height:44px;font-size:15px}
  .bar{grid-template-columns:1fr auto;gap:10px 12px;padding:10px 12px}
  .rail{grid-column:1 / -1;grid-row:1}
  .ch .t{display:none}
}
/* Embed mode: the page is shown in a frame on another page (its address ends in ?embed=1). */
html.embed .logo{visibility:hidden} /* the host page already carries the logo in its navigation */
@media (max-aspect-ratio:11/10),(max-width:860px){
  /* Once the host page has answered, the stacked layout takes its natural height, so the frame never needs its own scroll bar. */
  html.hosted,html.hosted body{height:auto}
  html.hosted .app{height:auto}
  html.hosted .wrap{overflow:visible}
  html.hosted .stage{min-height:0}
  html.hosted .app:fullscreen .wrap{overflow-y:auto}
  html.hosted .app:fullscreen .stage{min-height:100%}
}
@media (prefers-reduced-motion:reduce){
  .view>*,.status,.readout,.cover img{transition-duration:.01s !important;transition-delay:0s !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="wrap">
    <main class="stage at-title" id="stage">
      <div class="mapbox">
        <canvas id="map" role="img" aria-label="Animated isometric map of a hybrid network. It is discovered, labeled, segmented, and monitored across seven steps."></canvas>
        <div class="scrim"></div>
        <div class="iris"></div>
        <div class="readout" id="readout"><span class="k"></span><span class="v"></span></div>
      </div>
      <header class="top">
        <span class="logo" role="img" aria-label="Illumio">
          <svg viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M136 28.608H120V15.264H136V28.608ZM120 34.736H136V83.266H120V34.736Z" fill="#FFFFFF"></path><path d="M143.2 15.264H159.2V83.264H143.2V15.264Z" fill="#FFFFFF"></path><path d="M166.4 15.264H182.4V83.264H166.4V15.264Z" fill="#FFFFFF"></path><path d="M237.6 34.49V83.266H221.6V76.648C218.414 81.55 212.574 84.736 206.692 84.736C192.722 84.736 188.8 76.648 188.8 63.902V34.49H204.8V64.286C204.8 68.924 208.56 72.686 213.2 72.686C217.84 72.686 221.6 68.924 221.6 64.286V34.49H237.6Z" fill="#FFFFFF"></path><path d="M321.6 54.098V83.266H305.6V52.856C305.6 48.878 302.376 45.656 298.4 45.656C294.424 45.656 291.2 48.878 291.2 52.856V83.266H275.2V52.856C275.2 48.878 271.976 45.656 268 45.656C264.024 45.656 260.8 48.878 260.8 52.856V83.266H244.8V34.49H260.8V41.108C263.742 36.206 268.82 33.02 274.456 33.02C280.584 33.02 285.976 34.98 288.672 40.864C292.104 35.716 297.742 32.774 303.868 33.02C319.31 33.02 321.6 44.784 321.6 54.098Z" fill="#FFFFFF"></path><path d="M344 28.608H328V15.264H344V28.608ZM328 34.736H344V83.266H328V34.736Z" fill="#FFFFFF"></path><path d="M374.02 33.264C388.236 33.264 399.756 44.538 400 58.754C400 72.97 388.726 84.49 374.51 84.734C360.294 84.734 348.774 73.46 348.53 59.244V58.998C348.04 45.272 358.824 33.752 372.55 33.262C373.04 33.262 373.53 33.262 374.02 33.262V33.264ZM374.02 72.48C381.372 72.48 383.824 65.128 383.824 59C383.824 52.872 381.374 45.52 374.02 45.52C366.666 45.52 364.462 52.872 364.462 59C364.462 65.128 366.668 72.48 374.02 72.48Z" fill="#FFFFFF"></path><path d="M89.706 10.294V89.706H10.294V10.294H89.706ZM4.8 0C2.16 0 0 2.16 0 4.8V95.2C0 97.84 2.16 100 4.8 100H95.2C97.84 100 100 97.84 100 95.2V4.8C100 2.16 97.84 0 95.2 0H4.8Z" fill="#FF5500"></path><path d="M58.714 42.828L63.542 38H76.314C77.64 38 78.714 36.926 78.714 35.6V22.4C78.714 21.074 77.64 20 76.314 20H63.114C61.788 20 60.714 21.074 60.714 22.4V35.172L55.886 40H41.542L33.288 31.746V24.974C33.288 23.648 32.214 22.574 30.888 22.574H23.688C22.362 22.574 21.288 23.648 21.288 24.974V32.174C21.288 33.5 22.362 34.574 23.688 34.574H30.46L38.714 42.828V57.172L30.46 65.426H23.688C22.362 65.426 21.288 66.5 21.288 67.826V75.026C21.288 76.352 22.362 77.426 23.688 77.426H30.888C32.214 77.426 33.288 76.352 33.288 75.026V68.254L41.542 60H55.886L60.714 64.828V77.6C60.714 78.926 61.788 80 63.114 80H76.314C77.64 80 78.714 78.926 78.714 77.6V64.4C78.714 63.074 77.64 62 76.314 62H63.542L58.714 57.172V42.83V42.828Z" fill="#FF5500"></path></svg>
        </span>
        <span class="status" id="status" aria-live="polite"></span>
        <span class="guide">Simplifying segmentation</span>
      </header>
      <section class="copy" id="copy" aria-live="polite">
        <div class="view in" data-id="0.0">
          <p class="eyebrow">Seven simple steps</p>
          <h1 class="h1">Simplifying Segmentation</h1>
          <p class="lead">Microsegmentation has a reputation for being slow and complex. Today's tools make it far easier. A phased rollout strengthens security without causing downtime.</p>
          <div class="cta">
            <button class="btn primary" data-act="play"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>Play with sound</button>
            <button class="btn" data-act="step">Go at my own pace</button>
          </div>
          <p class="meta" id="meta">Best with sound</p>
        </div>
      </section>
    </main>
  </div>
